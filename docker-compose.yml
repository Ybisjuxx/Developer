services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: farmcontrol-backend
    ports:
      - "8000:8000"
    environment:
      - AUTH_REQUIRED=${AUTH_REQUIRED:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - ./farmacia.db:/app/farmacia.db
      - ./reportes_mensuales:/app/reportes_mensuales
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: farmcontrol-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
